schema_version: "0.1"
board_id: "spinc-jlc-rev-a"
title: "SPINC JLC Golden Rev A migration"
description: >-
  Fail-closed KiCad-to-JLCEDA migration and manufacturing-evidence flow for the
  first faithful SPINC reproduction. This flow performs no design optimization
  or component substitution.

preflight:
  - id: golden-source
    type: probe
    title: "Verify frozen upstream electrical/mechanical baseline"
    action:
      - "python3 JLC/verify_rev_a.py"
      - "python3 JLC/verify_power_stage.py"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: binding-manifest
    type: probe
    title: "Verify generated 91-designator / 44-C-number binding manifest"
    action: "python3 JLC/build_jlc_binding_manifest.py --check"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: harness-capability
    type: probe
    title: "Require the pinned Go harness with native CPL export"
    action: "jlc pcb export cpl --help"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

stages:
  - id: build-bundle
    title: "Build deterministic KiCad migration bundle"
    action: "python3 JLC/build_migration_bundle.py --output JLC/out/SPINC-JLC-Rev-A-KiCad.zip"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-KiCad.zip"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: bootstrap-runtime
    title: "Connect to the existing JLCEDA runtime"
    action: "jlc eda bootstrap --host auto"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: unique-client-route
    title: "Require one unambiguous JLCEDA client before non-idempotent import"
    action: "jlc project info"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    note: >-
      Fail closed when multiple JLCEDA clients/windows are connected. Close or
      disconnect unrelated clients, then resume from this gate. This proves only
      that routing is unambiguous; it does not authorize the sole client's cloud
      team/workspace. The operator must confirm that target before starting a live
      flow. Do not solve routing ambiguity by replaying import-kicad or hard-coding
      an unrelated source project as an anchor.
    on_fail: stop

  - id: import-kicad
    title: "Import the protected KiCad bundle as a new JLCEDA project"
    action: "jlc project import-external JLC/out/SPINC-JLC-Rev-A-KiCad.zip --file-type KiCad --name SPINC-JLC-Rev-A --switch=true"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    note: >-
      This is intentionally non-idempotent because import-external creates a new
      project. The 2026-09-22 failed run stopped before project creation while
      initializing the import buffer due to ambiguous multi-client routing.
      After a later-stage failure, continue from that failed stage rather than
      rerunning this import stage.
    on_fail: stop

  - id: activate-pcb
    title: "Activate imported PCB document"
    action: "jlc activate pcb"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: apply-drc-invariants
    title: "Apply the frozen design's pour clearances to the active DRC matrix"
    action: "jlc pcb drc apply-invariants --board JLC/rev-a"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    note: >-
      JLCEDA defaults require 10 mil; the frozen KiCad zones use 0.25 mm. Values
      are declared in JLC/rev-a/design-invariants.yaml with their source. Each
      cell is API read back after the UI write and is idempotent.
    on_fail: stop

  - id: via-hole-min
    title: "Set the Via Size lower bound below the design's 0.35 mm drill"
    action: "jlc pcb drc set-via-hole-min --value-mm 0.3"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    note: >-
      Changes only the DRC lower bound, never an existing via. The frozen design
      has 136 vias of 0.7/0.35 mm; JLCEDA's default lower bound is 0.5 mm.
    on_fail: stop

  - id: rebuild-pours
    title: "Re-pour every imported zone natively under the active rules and save"
    action: "jlc pcb pour rebuild-native --save --timeout 3m"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    note: >-
      The importer keeps KiCad's cached pour shapes, which overlapped other nets
      (2973 zero-distance DRC hits on 2026-09-24). Native re-pour recomputes the
      fills; the command fails closed unless every pour fills and component,
      track and via counts are unchanged.
    on_fail: stop

  - id: pcb-drc
    title: "Run JLCEDA PCB DRC and require the exact reviewed residual set"
    action: "python3 JLC/verify_drc_residuals.py --report JLC/out/SPINC-JLC-Rev-A-DRC.json"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-DRC.json"
    evidence: [exit_code, stdout, stderr, file_hash]
    note: >-
      Passes only if the live `jlc pcb drc --json` violation multiset equals
      JLC/rev-a/drc-residuals.json (2 reviewed items: FID2 component outline to
      H1 pad, copper gap 1.043 mm; R1 intentionally off-board in the frozen
      schematic, proven by the live schematic/PCB component difference). Any
      extra, missing or changed violation exits 5.
    on_fail: stop

  - id: export-bom
    title: "Export migrated BOM and verify JLC device identity drift"
    action: "jlc bom export -o JLC/out/SPINC-JLC-Rev-A-BOM.csv --format csv --verify"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-BOM.csv"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: reactivate-pcb
    title: "Return to PCB after schematic BOM export"
    action: "jlc activate pcb"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: export-cpl
    title: "Export native JLCEDA Pick-and-Place/CPL"
    action: "jlc pcb export cpl -o JLC/out/SPINC-JLC-Rev-A-CPL.csv"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-CPL.csv"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: export-gerber
    title: "Export JLCEDA Gerber as an explicitly unverified draft"
    action: "jlc pcb export gerber --draft -o JLC/out/SPINC-JLC-Rev-A-Gerber.draft.zip"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-Gerber.draft.zip"
    evidence: [exit_code, stdout, stderr, file_hash]
    note: >-
      The harness release path (`jlc pcb fabrication release`) is bound to Ploopy
      Altium profiles. SPINC's release gate is the next stage, which compares
      this draft against the frozen KiCad production Gerbers.
    on_fail: stop

  - id: gerber-equivalence
    title: "Release Gerber only if it geometrically reproduces the frozen KiCad Gerbers"
    action: >-
      uv run JLC/verify_gerber_equivalence.py
      --jlc JLC/out/SPINC-JLC-Rev-A-Gerber.draft.zip
      --report JLC/out/SPINC-JLC-Rev-A-gerber-equivalence.json
      --release-out JLC/out/SPINC-JLC-Rev-A-Gerber.zip
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-Gerber.zip"
    evidence: [exit_code, stdout, stderr, file_hash]
    note: >-
      Drills/slots 1:1, closed outline, all four copper layers (tracks and pads
      both ways, pours reported), solder mask and paste both ways. The order
      file is written only on a full pass. Silkscreen differs by design (JLCEDA
      re-renders text) and needs a visual review before ordering.
    on_fail: stop

  - id: export-epro2
    title: "Export migrated JLCEDA project container"
    action: "jlc project export -o JLC/out/SPINC-JLC-Rev-A.epro2"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A.epro2"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: order-package
    title: "Assemble the JLCPCB order package only if the migration is proven"
    action: >-
      python3 JLC/verify_order_package.py
      --jlc-bom JLC/out/SPINC-JLC-Rev-A-BOM.csv
      --jlc-cpl JLC/out/SPINC-JLC-Rev-A-CPL.csv
      --gerber JLC/out/SPINC-JLC-Rev-A-Gerber.zip
      --gerber-report JLC/out/SPINC-JLC-Rev-A-gerber-equivalence.json
      --out JLC/out/order
    gate:
      exit_code: 0
      file_exists: "JLC/out/order/ORDER-MANIFEST.json"
    evidence: [exit_code, stdout, stderr, file_hash]
    note: >-
      JLCEDA carries no LCSC numbers through a KiCad import and exports raw
      footprint origins, so the order uses the equivalence-released Gerber plus
      the frozen upstream bom.csv/positions.csv byte-identical. The JLC BOM/CPL
      must match them except for the exact differences declared in
      JLC/rev-a/order-deltas.json. Placement rotations/offsets still need the
      JLCPCB assembly preview review before payment. The former roundtrip
      stage assumed LCSC-bound JLCEDA devices and is retained as
      JLC/verify_jlc_export.py for that future path.
    on_fail: stop
