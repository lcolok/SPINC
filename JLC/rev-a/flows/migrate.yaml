schema_version: "0.1"
board_id: "spinc-jlc-rev-a"
title: "SPINC JLC Golden Rev A migration"
description: >-
  Fail-closed KiCad-to-JLCEDA migration and manufacturing-evidence flow for the
  first faithful SPINC reproduction. This flow performs no design optimization
  or component substitution.

preflight:
  - id: golden-source
    type: probe
    title: "Verify frozen upstream electrical/mechanical baseline"
    action:
      - "python3 JLC/verify_rev_a.py"
      - "python3 JLC/verify_power_stage.py"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: binding-manifest
    type: probe
    title: "Verify generated 91-designator / 44-C-number binding manifest"
    action: "python3 JLC/build_jlc_binding_manifest.py --check"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: harness-capability
    type: probe
    title: "Require the pinned Go harness with native CPL export"
    action: "jlc pcb export cpl --help"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

stages:
  - id: build-bundle
    title: "Build deterministic KiCad migration bundle"
    action: "python3 JLC/build_migration_bundle.py --output JLC/out/SPINC-JLC-Rev-A-KiCad.zip"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-KiCad.zip"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: bootstrap-runtime
    title: "Connect to the existing JLCEDA runtime"
    action: "jlc eda bootstrap --host auto"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: import-kicad
    title: "Import the protected KiCad bundle as a new JLCEDA project"
    action: "jlc project import-external JLC/out/SPINC-JLC-Rev-A-KiCad.zip --file-type KiCad --name SPINC-JLC-Rev-A --switch=true"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    note: >-
      This is intentionally non-idempotent because import-external creates a new
      project. After a later-stage failure, continue from that failed stage rather
      than rerunning this import stage.
    on_fail: stop

  - id: activate-pcb
    title: "Activate imported PCB document"
    action: "jlc activate pcb"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: pcb-drc
    title: "Run JLCEDA PCB DRC"
    action: "jlc pcb drc"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: export-bom
    title: "Export migrated BOM and verify JLC device identity drift"
    action: "jlc bom export -o JLC/out/SPINC-JLC-Rev-A-BOM.csv --format csv --verify"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-BOM.csv"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: reactivate-pcb
    title: "Return to PCB after schematic BOM export"
    action: "jlc activate pcb"
    gate:
      exit_code: 0
    evidence: [exit_code, stdout, stderr]
    on_fail: stop

  - id: export-cpl
    title: "Export native JLCEDA Pick-and-Place/CPL"
    action: "jlc pcb export cpl -o JLC/out/SPINC-JLC-Rev-A-CPL.csv"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-CPL.csv"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: export-gerber
    title: "Export JLCEDA Gerber fabrication evidence"
    action: "jlc pcb export gerber -o JLC/out/SPINC-JLC-Rev-A-Gerber.zip"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-Gerber.zip"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: export-epro2
    title: "Export migrated JLCEDA project container"
    action: "jlc project export -o JLC/out/SPINC-JLC-Rev-A.epro2"
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A.epro2"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop

  - id: roundtrip
    title: "Round-trip migrated BOM/CPL against Golden KiCad production data"
    action: >-
      python3 JLC/verify_jlc_export.py
      --bom JLC/out/SPINC-JLC-Rev-A-BOM.csv
      --cpl JLC/out/SPINC-JLC-Rev-A-CPL.csv
      --report JLC/out/SPINC-JLC-Rev-A-roundtrip.json
    gate:
      exit_code: 0
      file_exists: "JLC/out/SPINC-JLC-Rev-A-roundtrip.json"
    evidence: [exit_code, stdout, stderr, file_hash]
    on_fail: stop
