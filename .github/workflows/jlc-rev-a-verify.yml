name: JLC Rev A verification

on:
  push:
    branches:
      - jlc-rev-a
    paths:
      - 'PCB/**'
      - 'JLC/**'
      - '.github/workflows/jlc-rev-a-verify.yml'
  pull_request:
    paths:
      - 'PCB/**'
      - 'JLC/**'
      - '.github/workflows/jlc-rev-a-verify.yml'

permissions:
  contents: read

jobs:
  verify-reproduction-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify JLC Rev A equivalence guardrails
        run: |
          python JLC/verify_rev_a.py
          python JLC/verify_power_stage.py

      - name: Verify generated JLC device binding manifest
        run: python JLC/build_jlc_binding_manifest.py --check

      - name: Self-test JLCEDA BOM/CPL round-trip verifier
        run: python JLC/verify_jlc_export.py --self-test

      - name: Syntax-check fail-closed runtime runner
        run: bash -n JLC/run_rev_a_harness.sh

      - name: Syntax-check JLCEDA Rev A fallback helpers
        run: |
          node --check JLC/jlceda-scripts/import-rev-a-kicad.js
          node --check JLC/jlceda-scripts/audit-jlc-library-bindings.js
          node --check JLC/jlceda-scripts/export-rev-a-audit.js

      - name: Build deterministic JLCEDA KiCad migration bundle
        run: python JLC/build_migration_bundle.py

      - name: Publish migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: SPINC-JLC-Rev-A-KiCad-${{ github.sha }}
          path: JLC/out/SPINC-JLC-Rev-A-KiCad.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish JLCEDA audit kit
        uses: actions/upload-artifact@v4
        with:
          name: SPINC-JLC-Rev-A-Audit-Kit-${{ github.sha }}
          path: |
            JLC/jlc-bindings.json
            JLC/run_rev_a_harness.sh
            JLC/jlceda-scripts/import-rev-a-kicad.js
            JLC/jlceda-scripts/audit-jlc-library-bindings.js
            JLC/jlceda-scripts/export-rev-a-audit.js
          if-no-files-found: error
          retention-days: 30
