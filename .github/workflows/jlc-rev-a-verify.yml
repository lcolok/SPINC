name: JLC Rev A verification

on:
  push:
    branches:
      - jlc-rev-a
    paths:
      - 'PCB/**'
      - 'JLC/**'
      - '.github/workflows/jlc-rev-a-verify.yml'
  pull_request:
    paths:
      - 'PCB/**'
      - 'JLC/**'
      - '.github/workflows/jlc-rev-a-verify.yml'

permissions:
  contents: read

jobs:
  verify-reproduction-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify JLC Rev A equivalence guardrails
        run: python JLC/verify_rev_a.py
