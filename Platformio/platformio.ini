; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
; Golden Rev A firmware builds are intentionally Linux/amd64 AID-remote only.
; Every network-resolved build input is pinned: no branch HEADs, carets or ranges.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
framework = arduino
board_build.core = earlephilhower
platform_packages =
	framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#fd65f6d4ab168d4bb181a3709738fe353ac93585
	toolchain-rp2040-earlephilhower @ https://github.com/earlephilhower/pico-quick-toolchain/releases/download/5.0.0/x86_64-linux-gnu.arm-none-eabi-78c24be.260719.tar.gz
	tool-picotool-rp2040-earlephilhower @ https://github.com/earlephilhower/pico-quick-toolchain/releases/download/5.0.0/x86_64-linux-gnu.picotool-6f6458d.260719.tar.gz
	tool-pioasm-rp2040-earlephilhower @ https://github.com/earlephilhower/pico-quick-toolchain/releases/download/5.0.0/x86_64-linux-gnu.pioasm-98a542c1.260719.tar.gz
lib_deps =
	adafruit/Adafruit VCNL4040@1.2.0
	https://github.com/adafruit/Adafruit_SHARP_Memory_Display.git#2d040a7ffc10c826361b911a88bf5f1a1253905a
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
	lvgl/lvgl@8.4.0
build_flags =
	-I include
